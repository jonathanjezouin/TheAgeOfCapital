[package]
name = "sim-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pont WebAssembly du moteur sim : une simulation globale, des fonctions C, des instantanés JSON"

[lib]
crate-type = ["cdylib"]

[dependencies]
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
