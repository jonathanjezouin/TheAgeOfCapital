[package]
name = "sim-wasm"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Pont WebAssembly du moteur sim (POC v2) : interface C, instantanés JSON"

[lib]
crate-type = ["cdylib"]

[dependencies]
sim = { path = "../sim" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
