[package]
name = "sim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Moteur de simulation économique de The Age Of Capital (crate pure, sans napi)"

[lib]
name = "sim"
path = "src/lib.rs"

[[bin]]
name = "sim-cli"
path = "src/bin/sim_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
