# Données du POC-A. Quantités en unités/jour (converties en milli-unités au chargement).
# Aucune valeur de gameplay n'est codée en dur dans le moteur.

[simulation]
jours_par_an = 365
jours_stock_sortie = 10.0          # plafond du stock d'extrant d'un bâtiment (jours de production)
jours_stock_entree = 5.0           # plafond du stock d'intrants (jours de besoin)
jours_stock_quartier = 10.0        # plafond du stock d'un quartier (jours de consommation)
rayon_max_cout = 4000              # périmètre d'un lieu (coût de transport), 100 = 1 tile
nb_rondes_appel_offres = 3
stock_initial_quartier_jours = 5.0
stock_initial_entree_jours = 3.0
stock_initial_sortie_jours = 2.0

[infrastructure]
cout_tuile = 100
capacite_nominale = 400.0          # charge/jour d'un segment sans surcoût
capacite_max = 800.0               # au-delà : livraison différée à J+1
poids_trajet_pop = 10.0            # charge d'un trajet domicile-travail d'une pop

[demographie]
habitants_par_pop = 100
capacite_quartier_pops = 10
naissance_max = 0.040              # /an à satisfaction 1
seuil_satisfaction_naissance = 0.30
mortalite_base = 0.025             # /an à sat_nourriture 1
mortalite_max = 0.080              # /an à sat_nourriture 0
acceleration = 1.0                 # facteur appliqué aux deux taux (observation du POC)

[[ressources]]
nom = "grain"
peremption_jour = 0.0002
[[ressources]]
nom = "viande"
peremption_jour = 0.02
[[ressources]]
nom = "fruit"
peremption_jour = 0.03
[[ressources]]
nom = "bois"
peremption_jour = 0.0
[[ressources]]
nom = "lin"
peremption_jour = 0.0
[[ressources]]
nom = "laine"
peremption_jour = 0.0
[[ressources]]
nom = "tissu"
peremption_jour = 0.0
[[ressources]]
nom = "vetements"
peremption_jour = 0.0

# Besoins d'une pop (100 hab) par jour. Somme des poids = 1.
# La mortalité ne dépend que de la catégorie "nourriture".
[[besoins]]
ressource = "grain"
par_pop_jour = 5.0
poids = 0.4
categorie = "nourriture"
[[besoins]]
ressource = "viande"
par_pop_jour = 1.0
poids = 0.1
categorie = "nourriture"
[[besoins]]
ressource = "fruit"
par_pop_jour = 1.0
poids = 0.1
categorie = "nourriture"
[[besoins]]
ressource = "bois"
par_pop_jour = 2.0
poids = 0.2
categorie = "autre"
[[besoins]]
ressource = "vetements"
par_pop_jour = 0.5
poids = 0.2
categorie = "autre"

# Bâtiments : effectif en pops, intrants et extrants par jour à effectif plein.
[[batiments]]
nom = "champ"
asset = "bat_champ"
pops = 4
extrants = [{ ressource = "grain", qte = 100.0 }]
[[batiments]]
nom = "paturage"
