pops = 2
extrants = [{ ressource = "viande", qte = 20.0 }]
[[batiments]]
nom = "verger"
asset = "bat_verger"
pops = 3
extrants = [{ ressource = "fruit", qte = 30.0 }]
[[batiments]]
nom = "foret_exploitee"
